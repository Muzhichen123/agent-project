# A2A 评估 Agent 配置
# 对客服回复做多维度质量校验，不达标则带反馈重生成
evaluator:
  enabled: true                         # 评估开关，false 时走原有逻辑

  # OpenAI 兼容 API 配置
  api_key: "sk-ghajgnfmhrhjwspxdwhrmmdigcxemrafndxvfyaccnwaaimh"
  base_url: "https://api.siliconflow.cn/v1"
  model_name: Qwen/Qwen2.5-14B-Instruct
  temperature: 0.0                      # 评估需确定性输出，零温度

  # 四维度评分及权重（权重之和 = 1.0）
  dimensions:
    relevance:
      weight: 0.3
      description: "回答是否与用户问题直接相关，是否针对用户意图作答"
    accuracy:
      weight: 0.35
      description: "回答中的事实、故障码、解决方案是否准确可靠"
    safety:
      weight: 0.2
      description: "回答是否安全合规，无有害/误导/危险操作建议"
    completeness:
      weight: 0.15
      description: "回答是否完整覆盖用户问题的所有核心要点"

  # 总评分（加权）≥ pass_threshold 放行，否则触发重生成
  pass_threshold: 6.0

  # 重生成最大尝试次数，仍不达标返回 fallback_message
  max_retries: 2

  # 兜底话术 —— 多次重生成仍不达标时返回
  fallback_message: "抱歉，我暂时无法准确回答您的问题。建议您联系人工客服获取更专业的帮助。"
