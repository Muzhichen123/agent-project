# A2A 评估 Agent 配置（模板）
# 复制为 evaluator.yml 并填入你的 api_key
evaluator:
  enabled: true                         # 评估开关，false 时走原有逻辑

  # OpenAI 兼容 API 配置（如 SiliconFlow / OpenRouter）
  api_key: "sk-your-api-key-here"       # ⚠️ 填入你的 API Key
  base_url: "https://api.siliconflow.cn/v1"
  model_name: Qwen/Qwen2.5-14B-Instruct
  temperature: 0.0

  # 四维度评分及权重（权重之和 = 1.0）
  dimensions:
    relevance:
      weight: 0.3
      description: "回答是否与用户问题直接相关"
    accuracy:
      weight: 0.35
      description: "事实、故障码、解决方案是否准确"
    safety:
      weight: 0.2
      description: "是否安全合规，无有害/误导建议"
    completeness:
      weight: 0.15
      description: "是否完整覆盖问题核心要点"

  pass_threshold: 6.0
  max_retries: 2
  fallback_message: "抱歉，我暂时无法准确回答您的问题。建议您联系人工客服获取更专业的帮助。"
