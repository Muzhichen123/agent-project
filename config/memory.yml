# Memory 机制配置
memory:
  enabled: true                         # 已开启

  # 短期记忆：保留最近 N 轮完整对话
  short_term:
    max_turns: 5                        # 最近 5 轮保留原文

  # 对话摘要：超出短期窗口的历史压缩为摘要
  summary:
    enabled: true
    max_summary_length: 300             # 摘要最大字数
    trigger_at_turns: 5                 # 总轮数 > 5 时触发摘要压缩

  # 用户画像：从对话中提取用户特征
  profile:
    enabled: true
    extract_interval: 3                 # 每 3 轮对话更新一次画像

  # 工作记忆：当前任务状态（多次问同一个问题时保留上下文）
  working_memory:
    max_idle_turns: 3                   # 连续 3 轮无关联后清空工作记忆
