# RoboServe 配置文件模板
# 复制此文件为 agent.yml 并填入你的 API Key：
#   cp config/agent.example.yml config/agent.yml

# Redis 会话存储
redis:
  host: localhost
  port: 6379
  db: 0
  ttl: 2592000          # 30 天，单位：秒

# 天气查询（APISpace）
weather:
  api_key: "your-weather-api-key"
  base_url: "https://eolink.o.apispace.com/456456/weather/v001/now"

# 主对话模型（通义千问 DashScope）
model:
  name: "qwen-plus"     # 可选：qwen-plus / qwen-max / qwen-turbo
  api_key: "your-dashscope-api-key"

# A2A 评估 Agent（硅基流动免费模型）
evaluator:
  enabled: true
  api_key: "your-siliconflow-api-key"
  base_url: "https://api.siliconflow.cn/v1"
  model_name: Qwen/Qwen2.5-14B-Instruct
  temperature: 0.0
  pass_threshold: 6.0
  max_retries: 2
  fallback_message: "抱歉，我暂时无法准确回答您的问题。建议您联系人工客服获取更专业的帮助。"
  dimensions:
    relevance:
      weight: 0.3
    accuracy:
      weight: 0.35
    safety:
      weight: 0.2
    completeness:
      weight: 0.15

# 外部数据文件路径
external_data_path: "data/external/records.csv"
